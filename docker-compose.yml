services:
  web:
    build:
      context: .
      args:
        NEXT_PUBLIC_CONTACT_API_URL: ${NEXT_PUBLIC_CONTACT_API_URL:-https://replace-with-your-worker-domain}
        NEXT_PUBLIC_TURNSTILE_SITE_KEY: ${NEXT_PUBLIC_TURNSTILE_SITE_KEY:-replace-with-turnstile-site-key}
    ports:
      - "80:80"
    restart: unless-stopped
