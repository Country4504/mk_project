server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Next.js static export writes /route/ as /route.html by default.
    # Prefer directory index files, then fall back to the exported HTML file.
    location / {
        try_files $uri $uri/index.html $uri.html =404;
    }
}
